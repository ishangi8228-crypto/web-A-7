<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Font | Text | CSS Box Model (w/h/m/p/b)</title>
    <style>
        h1{
            color :blue ! important;
            background-color:antiquewhite;
            font-family:time new roman;
            font-weight: 100;
            font-style:italic;
        }
        p{
            text-align: left;
            text-decoration : none;
            text-transform:capitalize;
            text-shadow: 0px 1px 2px red;
        }
        #box{
            width: 200px;
            height: 200px;
            background: #CCC;
            border: 5px solid #000;
            margin: 0px 10px 6px 5px;
            padding: 5px,6px;
        }
    </style>
</head>
<body>
    <!--css - inline / internal and external -->
    <h1 style="font-size: 4em; color:aqua">Hello World!</h1>
    <div id="box">
    <p>
        lorem ip
    </p>
</body>
</html>
